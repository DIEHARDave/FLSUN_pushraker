# Once a day, checks PyPI for a newer pushraker than requirements.txt pins.
# When there is one, opens a pull request that bumps the pin. Merging it
# ships the new version to every T1 through the update manager, so test it
# on a printer first (the PR says how).
name: pushraker release check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare with PyPI
        id: check
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re, urllib.request
          pinned = re.search(r"^pushraker==(\S+)", open("requirements.txt").read(), re.M).group(1)
          with urllib.request.urlopen("https://pypi.org/pypi/pushraker/json", timeout=30) as r:
              latest = json.load(r)["info"]["version"]   # newest non-prerelease
          def key(v):
              return tuple(int(x) for x in re.findall(r"\d+", v))
          print(f"pinned={pinned}")
          print(f"latest={latest}")
          print(f"newer={'true' if key(latest) > key(pinned) else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.check.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          branch="pushraker-${LATEST}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              echo "Branch $branch exists already; nothing to do."
              exit 0
          fi

          # Does the new release still need tools/fix_page.py?
          pip download --no-deps --only-binary :all: -q -d /tmp/pr "pushraker==${LATEST}"
          python3 -m zipfile -e /tmp/pr/pushraker-*.whl /tmp/pr/x
          if python3 -c "import sys; sys.path.insert(0, 'tools'); import fix_page; sys.exit(fix_page.OLD not in open('/tmp/pr/x/pushraker/web/index.html', encoding='utf-8').read())"; then
              fix="**Still needed**: the settings page in ${LATEST} has the Save/Send Test bug, and \`tools/fix_page.py\` keeps patching it."
          else
              fix="**No longer needed**: ${LATEST}'s settings page doesn't have the Save/Send Test bug, so \`tools/fix_page.py\` does nothing. It can be removed in a later change."
          fi

          sed -i "s/^pushraker==.*/pushraker==${LATEST}/" requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "pushraker ${LATEST}"
          git push origin "$branch"

          cat > /tmp/body.md <<EOF
          pushraker **${LATEST}** is out on PyPI (pinned now: ${PINNED}).

          - Release notes: https://github.com/noon92/pushraker/releases/tag/v${LATEST}
          - Changes: https://github.com/noon92/pushraker/compare/v${PINNED}...v${LATEST}
          - Page fix: ${fix}

          **Before merging**, try it on a T1. Merging ships it to every printer through the update manager.

          \`\`\`sh
          cd ~/FLSUN_pushraker && git fetch origin ${branch} && git checkout ${branch} && sudo ./sync.sh
          \`\`\`

          Then check that Send Test works at \`http://<printer-ip>/notifications/\`. Afterwards, \`git checkout main\` puts the printer back on the update manager's branch.

          Opened by the daily release check (\`.github/workflows/pushraker-release.yml\`).
          EOF
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "pushraker ${LATEST}" --body-file /tmp/body.md
