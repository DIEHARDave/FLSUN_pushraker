# FLSUN_pushraker - Moonraker settings
# install.sh copies this file to ~/printer_data/config/flsun_pushraker.conf
# once and never overwrites it.

[update_manager flsun_pushraker]
type: git_repo
primary_branch: main
path: ~/FLSUN_pushraker
origin: https://github.com/DIEHARDave/FLSUN_pushraker.git
# Restarting the service after an update runs sync.sh, which installs the
# pushraker version in requirements.txt.
managed_services: flsun_pushraker
